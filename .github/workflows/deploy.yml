# Publishes the site to GitHub Pages on every push to main, and again every Monday
# so the GitHub data (recent repos, GyozaOS progress, "last updated") stays fresh.
# The refreshed data only goes into the deployed site; nothing is committed back to the repo.
# Requires Settings > Pages > Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refresh GitHub data
        # If GitHub's API fails, deploy anyway with the data file already in the repo
        continue-on-error: true
        run: python3 scripts/update_data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
