<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Portfolio 98</title>
  <link rel="icon" href="/Portfolio_Win98/icons/windows-16.png" type="image/png">
  <link rel="stylesheet" href="/Portfolio_Win98/style.css?v=2026-10-19c">
  <script>
    // Apply a saved theme before the page draws. Dark is the default (see data-theme above).
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch { /* storage blocked */ }
  </script>
  <style>
    body { display: grid; place-items: center; padding: 16px; overflow: auto; }
    .window { position: static; width: 420px; }
    .error { display: flex; gap: 16px; align-items: flex-start; }
    .error img { flex: none; image-rendering: pixelated; }
  </style>
</head>
<body>
  <!-- GitHub Pages shows this page for any address that doesn't exist. Paths start with /Portfolio_Win98/ (the repo name) so they work at any depth. -->
  <div class="window active" role="alertdialog" aria-labelledby="error-title">
    <div class="title-bar">
      <span class="title-text" id="error-title">404.EXE</span>
      <div class="title-controls"><a class="tb-close" href="/Portfolio_Win98/" aria-label="Close" style="display:block;width:16px;height:14px;background-color:var(--face);background-repeat:no-repeat;background-position:center;box-shadow:var(--button)"></a></div>
    </div>
    <div class="window-body">
      <div class="error">
        <img src="/Portfolio_Win98/icons/error.png" alt="" width="32" height="32">
        <div>
          <p>This page has performed an illegal operation and could not be found.</p>
          <p class="muted">Error 404: the file may have been moved, renamed, or sent to the Recycle Bin.</p>
        </div>
      </div>
      <div class="button-row right">
        <a class="button" href="/Portfolio_Win98/">Go to desktop</a>
      </div>
    </div>
  </div>
</body>
</html>
